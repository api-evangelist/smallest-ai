specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Smallest AI
providerId: smallest-ai
created: '2026-06-21'
modified: '2026-06-21'
reconciled: false
tags:
- AI
- Text to Speech
- Voice
- Realtime
- Voice Agents
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Smallest AI Waves and Atoms spend. Waves bills text-to-speech
  usage on a per-1,000-character basis by model (Lightning v3.1 and Lightning
  v3.1 Pro), Pulse speech-to-text per minute transcribed, and voice agents
  (Atoms) by usage/credit subscription. Enterprise agreements provide custom
  volume pricing. Exact rates are subject to change and are not fully reconciled.
notes: >-
  Per-character TTS and per-minute STT rates are subject to change; verify
  against the Smallest AI pricing page during reconciliation.
sources:
- https://smallest.ai/pricing
- https://docs.smallest.ai/
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Smallest AI
serviceCategory: AI and Machine Learning
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Smallest AI Waves
  ServiceCategory: AI and Machine Learning
  ProviderName: Smallest AI
  PublisherName: Smallest AI
  InvoiceIssuerName: Smallest AI
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: tts_characters
  description: TTS characters synthesized, billed per 1,000 characters per Lightning model.
  unit: characters
  aggregation: sum
  dimensions:
  - account
  - model
  - voice
- name: stt_minutes
  description: Audio minutes transcribed via Pulse STT, billed per minute.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - model
- name: voice_clones
  description: Cloned voices created on the account.
  unit: voices
  aggregation: sum
  dimensions:
  - account
- name: stream_connections
  description: Concurrent realtime SSE/WebSocket TTS connections opened.
  unit: connections
  aggregation: max
  dimensions:
  - account
- name: atoms_minutes
  description: Voice-agent minutes consumed on the Atoms platform.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - agent
principles:
- name: Visibility
  description: Pull Smallest AI usage exports; track per-model character burn and per-minute STT/agent usage.
- name: Allocation
  description: Tag API keys per workload/team; map TTS character spend and Atoms minutes to cost centers.
- name: Optimization
  description: Use standard Lightning v3.1 instead of Pro where Pro quality is unneeded; trim synthesized text length; reuse cloned voices.
- name: Accountability
  description: Assign owners per project/key; review character and minute spend monthly against budget.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
