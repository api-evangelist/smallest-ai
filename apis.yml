aid: smallest-ai
url: https://raw.githubusercontent.com/api-evangelist/smallest-ai/refs/heads/main/apis.yml
name: Smallest AI
kind: company
description: Smallest AI builds ultra-low-latency voice infrastructure - the Waves
  text-to-speech engine (Lightning / Lightning v2 models) for realtime speech
  synthesis and instant voice cloning, plus the Atoms platform for building and
  deploying production voice agents. The Waves REST API at
  https://waves-api.smallest.ai/api/v1 generates speech with sub-100ms latency,
  supports SSE and WebSocket streaming, and exposes voice listing and cloning via
  a Bearer-authenticated interface.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- AI
- Text to Speech
- Voice
- Realtime
- Voice Agents
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
apis:
- aid: smallest-ai:text-to-speech-waves
  name: Smallest AI Text-to-Speech (Waves)
  tags:
  - Text to Speech
  - Waves
  - Lightning
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.smallest.ai/waves/api-reference
  baseURL: https://waves-api.smallest.ai/api/v1
  properties:
  - url: https://docs.smallest.ai/waves/documentation/getting-started/introduction
    type: Documentation
  - url: https://docs.smallest.ai/waves/api-reference
    type: APIReference
  - url: openapi/smallest-ai-openapi.yml
    type: OpenAPI
  description: Synthesizes natural speech from text with the Lightning family of
    models (sub-100ms latency, up to 44.1 kHz) via POST /lightning/get_speech,
    with configurable voice, sample rate, speed, and language.
- aid: smallest-ai:streaming-realtime-tts
  name: Smallest AI Streaming / Realtime TTS
  tags:
  - Streaming
  - Realtime
  - WebSocket
  - SSE
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.smallest.ai/waves/api-reference
  baseURL: https://waves-api.smallest.ai/api/v1
  properties:
  - url: https://docs.smallest.ai/waves/documentation/text-to-speech-lightning/streaming
    type: Documentation
  - url: openapi/smallest-ai-openapi.yml
    type: OpenAPI
  - url: asyncapi/smallest-ai-asyncapi.yml
    type: AsyncAPI
  description: Realtime, low-latency text-to-speech delivered as base64 audio
    chunks over HTTP Server-Sent Events (POST /lightning-v2/get_speech/stream) and
    over a bidirectional WebSocket (wss://.../lightning-v2/get_speech/stream).
- aid: smallest-ai:voices-cloning
  name: Smallest AI Voices / Cloning
  tags:
  - Voices
  - Voice Cloning
  - Catalog
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.smallest.ai/waves/api-reference
  baseURL: https://waves-api.smallest.ai/api/v1
  properties:
  - url: https://docs.smallest.ai/waves/documentation/voice-cloning
    type: Documentation
  - url: openapi/smallest-ai-openapi.yml
    type: OpenAPI
  description: Lists available prebuilt voices, clones a new voice from a short
    audio sample, lists cloned voices, and deletes cloned voices for use as
    voice_id values in synthesis requests.
- aid: smallest-ai:atoms-voice-agents
  name: Smallest AI Atoms (Voice Agents)
  tags:
  - Voice Agents
  - Atoms
  - Conversational AI
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://atoms-docs.smallest.ai/
  baseURL: https://atoms-api.smallest.ai
  properties:
  - url: https://atoms-docs.smallest.ai/
    type: Documentation
  description: The Atoms platform for building, testing, and deploying production
    voice agents - orchestrating Waves TTS and Pulse STT with LLM-driven
    conversation flows, exposed through a developer API and dashboard.
